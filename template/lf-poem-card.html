<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
.wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.center {
  text-align:center;
  display:flex; flex-direction:column; align-items:center;
}
.ornament {
  color:#d9c79a; opacity:0.85;
  font-size:28px; letter-spacing:22px; margin-bottom:36px;
}
.gazel {
  font-family:'Inter', sans-serif; font-weight:400;
  font-size:32px; letter-spacing:14px; text-transform:uppercase;
  color:#d9c79a; opacity:0.95; margin-bottom:42px;
  text-shadow:
    0 0 6px rgba(0,0,0,0.95),
    0 2px 6px rgba(0,0,0,0.9);
}
.divider-wrap { display:flex; align-items:center; gap:26px; margin-bottom:48px; width:560px; }
.dline { flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(217,199,154,0.7),transparent); }
.ddia { width:7px; height:7px; background:#d9c79a; transform:rotate(45deg); opacity:0.85; }
.firstline {
  font-family:'Cormorant Garamond', serif;
  font-style:italic; font-weight:500;
  font-size:62px; line-height:1.4;
  color:#f5efe1; max-width:1500px;
  text-shadow:
    0 0 10px rgba(0,0,0,0.95),
    0 2px 8px rgba(0,0,0,0.95),
    0 4px 18px rgba(0,0,0,0.85),
    0 8px 36px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
  <div class="wrap"><div class="center">
    <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    <div class="gazel">{{gazelLabel}}</div>
    <div class="divider-wrap"><div class="dline"></div><div class="ddia"></div><div class="dline"></div></div>
    <div class="firstline">{{firstLine}}</div>
  </div></div>
</body>
</html>
