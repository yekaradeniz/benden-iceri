<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
.wrap { width:100%; height:100%; display:flex; flex-direction:column; align-items:center;
  justify-content:center; padding:90px 200px; }
.label {
  font-family:'Inter', sans-serif; font-weight:500;
  font-size:22px; letter-spacing:14px; text-transform:uppercase;
  color:#d9c79a; opacity:0.9;
  margin-bottom:22px;
  text-shadow:
    0 0 6px rgba(0,0,0,0.95),
    0 2px 6px rgba(0,0,0,0.9);
}
.divider { width:110px; height:2px; background:rgba(217,199,154,0.55); margin-bottom:54px; }
.serh {
  font-family:'Cormorant Garamond', serif;
  font-weight:500;
  font-size:{{serhFontSize}};
  line-height:1.7;
  color:#f0e9d6;
  text-align:left;
  max-width:1500px;
  text-shadow:
    0 0 8px rgba(0,0,0,0.95),
    0 2px 6px rgba(0,0,0,0.92),
    0 4px 14px rgba(0,0,0,0.85);
  white-space:pre-line;
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">Mânâsı</div>
    <div class="divider"></div>
    <div class="serh" id="serh">{{serh}}</div>
  </div>
<script>
  // Auto-shrink: 1080 yukseklik sigsin, min 28px
  const el = document.querySelector('#serh');
  const wrap = document.querySelector('.wrap');
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (wrap.scrollHeight > 1080 && size > 28) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
</script>
</body>
</html>
