<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:transparent;
  -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
.wrap { width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  padding:0 200px; }
.content { text-align:center; width:100%; max-width:1520px; }
.beyit {
  font-family:'Cormorant Garamond', serif;
  font-weight:600;
  font-size:{{beyitFontSize}};
  line-height:1.5;
  color:#faf6ec;
  white-space:pre-line;
  letter-spacing:0.6px;
  text-shadow:
    0 0 8px rgba(0,0,0,0.95),
    0 2px 6px rgba(0,0,0,0.95),
    0 4px 14px rgba(0,0,0,0.9),
    0 8px 32px rgba(0,0,0,0.75);
  margin-bottom:54px;
}
.divider { width:120px; height:2px; background:rgba(217,199,154,0.55); margin:0 auto 28px; }
.source {
  font-family:'Inter', sans-serif; font-weight:500;
  font-size:28px; letter-spacing:13px; text-transform:uppercase;
  color:#d9c79a; opacity:0.92;
  text-shadow:
    0 0 6px rgba(0,0,0,0.95),
    0 2px 6px rgba(0,0,0,0.9),
    0 4px 12px rgba(0,0,0,0.7);
}
</style>
</head>
<body>
  <div class="wrap"><div class="content">
    <div class="beyit" id="beyit">{{beyit}}</div>
    <div class="divider"></div>
    <div class="source">Salih Baba</div>
  </div></div>
<script>
  // Auto-shrink: 1080 yukseklik sigsin, min 36px
  const el = document.querySelector('#beyit');
  let size = parseFloat(getComputedStyle(el).fontSize);
  const max = 880;
  while (el.offsetHeight > max && size > 36) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
</script>
</body>
</html>
